<svg xmlns="http://www.w3.org/2000/svg" width="680" height="955" viewBox="0 0 680 955" role="img"><title>Single moving jaw gripper scheme</title><style>text{font-family:Helvetica,Arial,sans-serif}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600;fill:#1F1E1D}.tp{font-size:12px;font-weight:600;fill:#1F1E1D}</style><rect width="680" height="955" fill="#FFFFFF"/><text class="th" x="10.0" y="22.0" text-anchor="start" >Top view (looking down). The arm is to the left, the jaws point right.</text><text class="ts" x="10.0" y="60.0" text-anchor="start" >palm side ↑</text><text class="ts" x="10.0" y="330.0" text-anchor="start" >far side ↓</text><line x1="200.0" y1="95" x2="428.0" y2="95" stroke="#5F5E5A"/><line x1="200.0" y1="90" x2="200.0" y2="100" stroke="#5F5E5A"/><line x1="428.0" y1="90" x2="428.0" y2="100" stroke="#5F5E5A"/><text class="ts" x="314.0" y="89.0" text-anchor="middle" >38 mm, shaft to jaw tip</text><line x1="89.0" y1="74" x2="428.0" y2="74" stroke="#5F5E5A"/><line x1="89.0" y1="69" x2="89.0" y2="79" stroke="#5F5E5A"/><line x1="428.0" y1="69" x2="428.0" y2="79" stroke="#5F5E5A"/><text class="ts" x="258.5" y="68.0" text-anchor="middle" >fixed jaw plate 56.5 mm</text><rect x="8.0" y="112.4" width="237.0" height="18.0" fill="#7F77DD" stroke="#534AB7"/><polyline points="8.0,112.4 3.0,118.4 13.0,124.4 3.0,131.4" fill="none" stroke="#5F5E5A"/><text class="ts" x="6.0" y="104.4" text-anchor="start" >to arm</text><circle cx="65.0" cy="144.2" r="13.8" fill="#C9C7BE" stroke="#888780"/><text class="tp" x="65.0" y="148.2" text-anchor="middle" >H</text><rect x="89.0" y="130.4" width="339.0" height="18.0" fill="#888780" stroke="#5F5E5A"/><rect x="101.0" y="148.4" width="135.0" height="73.2" rx="3" fill="#E9E7DF" stroke="#8F8D85"/><rect x="284.0" y="148.4" width="132.0" height="18.0" fill="#E0B84C" stroke="#A67C1F"/><rect x="123.5" y="106.4" width="15.0" height="121.2" fill="#333333" fill-opacity="0.8" stroke="#1F1E1D"/><polygon points="169.0,213.9 171.1,154.0 446.9,163.6 444.8,223.6" fill="none" stroke="#378ADD" stroke-width="1.2" stroke-dasharray="5 4"/><polygon points="283.6,196.9 284.3,178.9 428.2,184.0 427.5,202.0" fill="none" stroke="#378ADD" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="320.0" y="166.4" width="108.0" height="108.0" fill="none" stroke="#5F5E5A" stroke-dasharray="4 3"/><text class="ts" x="374.0" y="218.0" text-anchor="middle" >example object</text><text class="ts" x="374.0" y="232.0" text-anchor="middle" >18 mm wide</text><circle cx="200.0" cy="185.0" r="21.0" fill="#B4B2A9" stroke="#888780"/><polygon points="240.8,259.0 255.6,248.6 338.1,366.6 323.4,376.9" fill="#378ADD" stroke="#185FA5"/><polygon points="262.4,258.5 331.3,356.8 346.0,346.5 277.2,248.2" fill="#E0B84C" stroke="#A67C1F"/><polygon points="158.2,177.6 207.4,143.2 365.7,369.3 316.5,403.7" fill="#B5D4F4" fill-opacity="0.55" stroke="#378ADD" stroke-width="1.2"/><circle cx="200.0" cy="185.0" r="5" fill="#1F1E1D"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><path d="M389.9 191.6 A190 190 0 0 1 309.0 340.6" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#ar)"/><text class="ts" x="430.0" y="290.0" text-anchor="start" >swing about 53°</text><text class="ts" x="300.0" y="428.0" text-anchor="start" >open (+55°)</text><text class="ts" x="452.0" y="214.0" text-anchor="start" >closed (+2°)</text><circle cx="125" cy="185" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="125.0" y="189.0" text-anchor="middle" >1</text><circle cx="225" cy="168" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="225.0" y="172.0" text-anchor="middle" >2</text><circle cx="351" cy="380" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="351.0" y="384.0" text-anchor="middle" >3</text><circle cx="290" cy="314" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="290.0" y="318.0" text-anchor="middle" >4</text><circle cx="350" cy="139" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="350.0" y="143.0" text-anchor="middle" >5</text><circle cx="350" cy="157" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="350.0" y="161.0" text-anchor="middle" >6</text><circle cx="120" cy="121" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="120.0" y="125.0" text-anchor="middle" >7</text><circle cx="131" cy="245" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="131.0" y="249.0" text-anchor="middle" >8</text><text class="th" x="10.0" y="482.0" text-anchor="start" >Front view (looking back toward the arm from the jaw tips; the palm side is on the right)</text><rect x="394.6" y="610.0" width="18.0" height="60.0" fill="#7F77DD" stroke="#534AB7"/><rect x="303.4" y="571.9" width="73.2" height="136.2" rx="3" fill="#E9E7DF" stroke="#8F8D85"/><rect x="376.6" y="571.9" width="18.0" height="108.0" fill="#888780" stroke="#5F5E5A"/><rect x="358.6" y="580.0" width="18.0" height="72.0" fill="#E0B84C" stroke="#A67C1F"/><rect x="300.4" y="568.9" width="115.2" height="142.2" fill="none" stroke="#333333" stroke-dasharray="5 3" stroke-width="1.5"/><rect x="319.0" y="559.9" width="42.0" height="12.0" fill="#B4B2A9" stroke="#888780"/><rect x="301.6" y="541.9" width="60.0" height="18.0" fill="#B5D4F4" stroke="#378ADD"/><rect x="322.6" y="559.9" width="18.0" height="120.0" fill="#378ADD" stroke="#185FA5"/><rect x="340.6" y="580.0" width="18.0" height="72.0" fill="#E0B84C" stroke="#A67C1F"/><line x1="150" y1="670.0" x2="470" y2="670.0" stroke="#5F5E5A" stroke-dasharray="4 3"/><text class="ts" x="476.0" y="672.0" text-anchor="start" >palm bottom</text><line x1="150" y1="679.9" x2="470" y2="679.9" stroke="#5F5E5A" stroke-dasharray="4 3"/><text class="ts" x="476.0" y="692.0" text-anchor="start" >jaw bottom (1.7 mm lower)</text><text class="ts" x="250.0" y="560.0" text-anchor="end" >far side</text><text class="ts" x="424.0" y="520.0" text-anchor="start" >palm side</text><circle cx="403.6" cy="640" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="403.6" y="644.0" text-anchor="middle" >7</text><circle cx="385.6" cy="600" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="385.6" y="604.0" text-anchor="middle" >5</text><circle cx="358.6" cy="600" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="358.6" y="604.0" text-anchor="middle" >6</text><circle cx="331.6" cy="625" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="331.6" y="629.0" text-anchor="middle" >4</text><circle cx="338" cy="700" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="338.0" y="704.0" text-anchor="middle" >1</text><circle cx="331.6" cy="551" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="331.6" y="555.0" text-anchor="middle" >3</text><circle cx="372" cy="566" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="372.0" y="570.0" text-anchor="middle" >2</text><circle cx="424" cy="566" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="424.0" y="570.0" text-anchor="middle" >8</text><circle cx="20" cy="744" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="20.0" y="748.0" text-anchor="middle" >1</text><text class="ts" x="38.0" y="748.0" text-anchor="start" >Gripper servo: SG90, shaft up, ears trimmed, 22.5 × 12.2 × 22.7 mm. It is clamped onto the fixed jaw plate.</text><circle cx="20" cy="764" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="20.0" y="768.0" text-anchor="middle" >2</text><text class="ts" x="38.0" y="768.0" text-anchor="start" >Horn: single arm trimmed to 12 mm, on the shaft.</text><circle cx="20" cy="784" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="20.0" y="788.0" text-anchor="middle" >3</text><text class="ts" x="38.0" y="788.0" text-anchor="start" >Spine: 46 × 10 × 3 mm, glued flat on the horn.</text><circle cx="20" cy="804" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="20.0" y="808.0" text-anchor="middle" >4</text><text class="ts" x="38.0" y="808.0" text-anchor="start" >Moving jaw plate: 24 × 20 × 3 mm, hangs under the spine, 14–38 mm ahead of the shaft.</text><circle cx="20" cy="824" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="20.0" y="828.0" text-anchor="middle" >5</text><text class="ts" x="38.0" y="828.0" text-anchor="start" >Fixed jaw plate: 56.5 × 18 × 3 mm, glued face to face onto the palm, starting 4 mm in front of pin H.</text><circle cx="20" cy="844" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="20.0" y="848.0" text-anchor="middle" >6</text><text class="ts" x="38.0" y="848.0" text-anchor="start" >Foam pads: 3 mm thick, on both inner jaw faces.</text><circle cx="20" cy="864" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="20.0" y="868.0" text-anchor="middle" >7</text><text class="ts" x="38.0" y="868.0" text-anchor="start" >Palm CH: 75 mm stick, three layers. The plate is glued over its front 26 mm.</text><circle cx="20" cy="884" r="10" fill="#F5F4EF" stroke="#1F1E1D"/><text class="tp" x="20.0" y="888.0" text-anchor="middle" >8</text><text class="ts" x="38.0" y="888.0" text-anchor="start" >Zip tie: around the palm, the plate and the servo, behind the spine.</text><text class="ts" x="10.0" y="920.0" text-anchor="start" >Dashed blue: jaw closed. Solid blue: jaw open (away from the palm).</text><text class="ts" x="10.0" y="938.0" text-anchor="start" >Opening between the pads: about 19 mm mid-jaw and 28 mm at the tips.</text></svg>