.8 606.6,238.4" fill="#378ADD" stroke="#185FA5"/><circle cx="574.5" cy="273.7" r="5" fill="#1F1E1D"/><text class="ts" x="531.6" y="339.2">gripper servo and jaws</text><rect x="440" y="50" width="12" height="12" rx="2" fill="#1D9E75"/><text class="ts" x="460" y="60"><tspan class="tp">L0 front</tspan>  AB upper arm, KF rod</text><rect x="440" y="72" width="12" height="12" rx="2" fill="#BA7517"/><text class="ts" x="460" y="82"><tspan class="tp">L1</tspan>  AK post, FH rod</text><rect x="440" y="94" width="12" height="12" rx="2" fill="#7F77DD"/><text class="ts" x="460" y="104"><tspan class="tp">L2</tspan>  DE rod, BF link, CH palm</text><rect x="440" y="116" width="12" height="12" rx="2" fill="#D85A30"/><text class="ts" x="460" y="126"><tspan class="tp">L3 back</tspan>  E–B–C forearm, AD crank</text><text class="ts" x="260" y="388">Tan bars: bamboo pins. Grey dots: glue stops.</text><text class="ts" x="260" y="406">⊕ marks the vertical rotation axis of the base.</text><text class="ts" x="260" y="424">Thickness is drawn 2× so the layers are readable.</text></svg>